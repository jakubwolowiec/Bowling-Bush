<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
	 <script src="https://unpkg.com/aframe-event-set-component@^4.1.1/dist/aframe-event-set-component.min.js"></script>
   <script>
    delete AFRAME.components["grabbable"];
  </script>
	<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.x/dist/aframe-extras.min.js"></script>
	<script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>
  
</head>
  <body>
    <script>AFRAME.registerComponent('phase-shift', {
        init: function () {
          var el = this.el
          el.addEventListener('gripdown', function () {
            el.setAttribute('collision-filter', {collisionForces: true})
          })
          el.addEventListener('gripup', function () {
            el.setAttribute('collision-filter', {collisionForces: false})
          })
        }
      });</script>  
    <a-scene physics>
      <a-assets><a-mixin id="all-interactions"
                 hoverable grabbable stretchable draggable
                 event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                 event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false"
                 dynamic-body="mass:100"
        ></a-mixin>

        <a-mixin id="grab-move"
                 hoverable grabbable draggable
                 event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                 event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false"
                 dynamic-body
        ></a-mixin>

        <a-mixin id="physics-hands"
                 physics-collider phase-shift
                 collision-filter="collisionForces: false"
                 static-body="shape: sphere; sphereRadius: 0.02"
                 super-hands="colliderEvent: collisions;
                              colliderEventProperty: els;
                              colliderEndEvent: collisions;
                              colliderEndEventProperty: clearedEls;"
        ></a-mixin></a-assets>
	<a-entity>
	<a-camera>
    <!-- Or <a-entity cursor></a-entity> -->
  </a-camera>
	 <a-entity id="rhand" mixin="physics-hands"
                  hand-controls="hand: right">
        </a-entity>
        <a-entity id="lhand" mixin="physics-hands"
                  hand-controls="hand: left">
        </a-entity>
	</a-entity>
      <a-box static-body position="-3 0.5 -3" scale="0.1 25 75" color="#4CC3D9"></a-box>
      <a-box static-body position="3 0.5 -3" scale="0.1 25 75" color="#4CC3D9"></a-box>
	  
      <a-box dynamic-body position="0 0.5 -3" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.2 0.5 -3.3" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.2 0.5 -3.3" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.4 0.5 -3.6" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0 0.5 -3.6" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.4 0.5 -3.6" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.2 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.6 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.2 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.6 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
	  
      <a-sphere  id="bush" mixin="sphere all-interactions"  position="0.25 1.25 -0.5" radius="0.2" color="#EF2D5E"></a-sphere>
	  
	  <a-plane static-body position="0 0 -2" rotation="-90 0 0" width="40" height="160" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
