<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
	<script src="https://unpkg.com/aframe-event-set-component@^4.1.1/dist/aframe-event-set-component.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.x/dist/aframe-extras.min.js"></script>
   <script>
    delete AFRAME.components["grabbable"];
  </script>
	<script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>
  
</head>
  <body>
    <a-scene physics>
      <a-assets><a-mixin id="all-interactions"
                 hoverable grabbable="usePhysics: true" stretchable draggable
                 event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                 event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false"
                 dynamic-body="mass:100"
        ></a-mixin>

        <a-mixin id="grab-move"
                 hoverable grabbable draggable
                 event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                 event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false"
                 dynamic-body
        ></a-mixin>
        <!--="objects: .grab-target; radius: 0.1"-->
        <a-mixin id="physics-hands"
                 sphere-collider
                 static-body="shape: sphere; sphereRadius: 0.04"
                 super-hands="colliderEvent: hit;
                              colliderEventProperty: el;
                              colliderEndEvent: hitEnd;
                              colliderEndEventProperty: el;
                              grabStartButtons: gripdown;
                              grabEndButtons: gripup;"
        ></a-mixin></a-assets>
	<a-entity>
	<a-camera>
    <!-- Or <a-entity cursor></a-entity> -->
  </a-camera>
	 <a-entity id="rhand" mixin="physics-hands"
                  hand-controls="hand: right; handModelStyle: lowPoly; color: #ffcccc">
        </a-entity>
        <a-entity id="lhand" mixin="physics-hands"
                  hand-controls="hand: left; handModelStyle: lowPoly; color: #ffcccc">
        </a-entity>
	</a-entity>
      <a-box static-body position="-3 0.5 -3" scale="0.1 25 75" color="#4CC3D9"></a-box>
      <a-box static-body position="3 0.5 -3" scale="0.1 25 75" color="#4CC3D9"></a-box>
	  
      <a-box dynamic-body position="0 0.5 -3" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.2 0.5 -3.3" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.2 0.5 -3.3" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.4 0.5 -3.6" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0 0.5 -3.6" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.4 0.5 -3.6" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.2 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="-0.6 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.2 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
      <a-box dynamic-body position="0.6 0.5 -3.9" scale="0.2 0.5 0.2" color="#000"></a-box>
	  
      <a-sphere id="bush" class="grab-target" mixin="all-interactions" position="0.25 1.25 -0.5" radius="0.2" color="#EF2D5E"></a-sphere>
	  
	  <a-plane static-body position="0 0 -2" rotation="-90 0 0" width="40" height="160" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
      const scene = document.querySelector('a-scene');
      const rhand = document.querySelector('#rhand');
      const lhand = document.querySelector('#lhand');
      const bush = document.querySelector('#bush');

      scene.addEventListener('loaded', function() {
        console.log('=== Scene Loaded ===');
        console.log('Right hand:', rhand);
        console.log('Left hand:', lhand);
        console.log('Bush sphere:', bush);
        console.log('Bush grabbable component:', bush.components.grabbable);
        
        // Debug right hand collisions
        rhand.addEventListener('hit', (evt) => {
          console.log('RIGHT HAND HIT - collided entity:', evt.detail);
        });
        
        // Debug left hand collisions
        lhand.addEventListener('hit', (evt) => {
          console.log('LEFT HAND HIT - collided entity:', evt.detail);
        });
        
        // Debug bush events
        bush.addEventListener('grab-start', (evt) => {
          console.log('✓ BUSH GRAB START - hand:', evt.detail.hand, 'hand position:', evt.detail.hand.object3D.position);
        });
        bush.addEventListener('grab-end', (evt) => {
          console.log('✓ BUSH GRAB END - hand:', evt.detail.hand);
        });
        bush.addEventListener('hover-start', (evt) => {
          console.log('BUSH HOVER START - hand:', evt.detail.hand);
        });
        
        // Track hand position every frame during grab
        setInterval(() => {
          if (bush.components.grabbable && bush.is('grabbed')) {
            const pos = rhand.object3D.position;
            console.log('Hand position:', pos.x.toFixed(3), pos.y.toFixed(3), pos.z.toFixed(3), 'Bush position:', bush.object3D.position.x.toFixed(3), bush.object3D.position.y.toFixed(3), bush.object3D.position.z.toFixed(3));
          }
        }, 500);
      });
    </script>
  </body>
</html>
