<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
	<script src="https://unpkg.com/aframe-event-set-component@^4.1.1/dist/aframe-event-set-component.min.js"></script>
	<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.x/dist/aframe-extras.min.js"></script>
   <script>
    delete AFRAME.components["grabbable"];
  </script>
	<script src="https://unpkg.com/super-hands@^3.0.6/dist/super-hands.min.js"></script>
  <script>

const BowlingGame = {

    frame: 1,
    throwNumber: 1,

    firstThrowPins: 0,

    totalScore: 0,

    rolls: [],

    pinPositions: [

        [0,0.5,-3],

        [0.2,0.5,-3.3],
        [-0.2,0.5,-3.3],

        [0.4,0.5,-3.6],
        [0,0.5,-3.6],
        [-0.4,0.5,-3.6],

        [-0.6,0.5,-3.9],
        [-0.2,0.5,-3.9],
        [0.2,0.5,-3.9],
        [0.6,0.5,-3.9]
    ]
};

AFRAME.registerComponent("bowling-manager", {

    init() {
this.ballScored = false;
        this.spawnPins();

        setInterval(() => {

            const ball = document.querySelector("#ball");

            if (
    ball.object3D.position.z < -5 &&
    !this.ballScored
) {
    this.ballScored = true;

    setTimeout(() => {
        this.endThrow();
    }, 2000);
}

        }, 1000);
    },

    spawnPins() {

        const scene = document.querySelector("a-scene");

        BowlingGame.pinPositions.forEach((pos,index)=>{

            const pin = document.createElement("a-box");

            pin.setAttribute("id","pin"+index);
            pin.setAttribute("class","pin");
            pin.setAttribute("dynamic-body","mass:1");

            pin.setAttribute(
                "position",
                `${pos[0]} ${pos[1]} ${pos[2]}`
            );

            pin.setAttribute(
                "scale",
                "0.15 0.5 0.15"
            );

            pin.setAttribute(
                "color",
                "#000"
            );

            scene.appendChild(pin);
        });
    },

    countDownPins() {

        let count = 0;

        document.querySelectorAll(".pin")
            .forEach(pin=>{

            const fallen =
    pin.object3D.position.y < 0.3;

            if(fallen)
                count++;
        });

        return count;
    },

    removeDownPins() {

        document.querySelectorAll(".pin")
            .forEach(pin=>{

            const fallen =
    pin.object3D.position.y < 0.3;

            if(fallen)
                pin.remove();
        });
    },

    spawnBall() {

        const scene = document.querySelector("a-scene");
this.ballScored = false;
        const oldBall =
            document.querySelector("#ball");

        if(oldBall)
            oldBall.remove();

        const ball =
            document.createElement("a-sphere");

        ball.setAttribute("id","ball");
        ball.setAttribute("radius","0.15");
        ball.setAttribute("color","#EF2D5E");

        ball.setAttribute(
            "position",
            "0 1.2 -0.5"
        );

        ball.setAttribute(
            "dynamic-body",
            "mass:5"
        );

        ball.setAttribute(
            "mixin",
            "grab-move"
        );

        scene.appendChild(ball);
    },

    resetFrame() {

        document.querySelectorAll(".pin")
            .forEach(pin=>pin.remove());

        this.spawnPins();

        BowlingGame.throwNumber = 1;

        BowlingGame.frame++;

        this.spawnBall();
    },

    updateScoreboard() {

        BowlingGame.totalScore =
            calculateScore(
                BowlingGame.rolls
            );

        document
            .querySelector("#scoreboard")
            .setAttribute(
                "value",
                `Frame ${BowlingGame.frame}
Score ${BowlingGame.totalScore}`
            );
    },
countStandingPins() {

    let count = 0;

    document.querySelectorAll(".pin").forEach(pin => {

        if (pin.object3D.position.y >= 0.3)
            count++;
    });

    return count;
},
    endThrow() {

        if(this.processing)
            return;

        this.processing = true;

        const knocked =
            this.countDownPins();

        if(BowlingGame.throwNumber === 1) {

            const standing = this.countStandingPins();
const knocked = 10 - standing;

BowlingGame.firstThrowPins = knocked;
BowlingGame.rolls.push(knocked);

            if(knocked === 10) {

                this.updateScoreboard();

                setTimeout(()=>{
                    this.resetFrame();
                    this.processing=false;
                },1000);

                return;
            }

            this.removeDownPins();

            BowlingGame.throwNumber = 2;

            this.spawnBall();

        } else {

            const standing = this.countStandingPins();
const secondThrow = (10 - BowlingGame.firstThrowPins) - standing;

BowlingGame.rolls.push(secondThrow);

            this.updateScoreboard();

            setTimeout(()=>{

                this.resetFrame();

                this.processing=false;

            },1000);
        }

        this.processing = false;
    }
});

function calculateScore(rolls) {

    let score = 0;
    let roll = 0;

    for(let frame=0;
        frame<10 && roll<rolls.length;
        frame++) {

        if(rolls[roll] === 10) {

            score +=
                10 +
                (rolls[roll+1]||0) +
                (rolls[roll+2]||0);

            roll++;

        }
        else if(
            (rolls[roll]||0)+
            (rolls[roll+1]||0)
            ===10
        ) {

            score +=
                10 +
                (rolls[roll+2]||0);

            roll += 2;

        }
        else {

            score +=
                (rolls[roll]||0)+
                (rolls[roll+1]||0);

            roll += 2;
        }
    }

    return score;
}

</script>
</head>
  <body>
    <a-scene physics bowling-manager>
      <a-assets><a-mixin id="all-interactions"
                 hoverable grabbable="usePhysics: true" stretchable draggable
                 event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                 event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false"
                 dynamic-body="mass:5"
        ></a-mixin>

        <a-mixin id="grab-move"
                 hoverable grabbable draggable
                 event-set__hoveron="_event: hover-start; material.opacity: 0.7; transparent: true"
                 event-set__hoveroff="_event: hover-end; material.opacity: 1; transparent: false"
                 dynamic-body
        ></a-mixin>
        <!--="objects: .grab-target; radius: 0.1"-->
        <a-mixin id="physics-hands"
                 sphere-collider
                 static-body="shape: sphere; sphereRadius: 0.04"
                 super-hands="colliderEvent: hit;
                              colliderEventProperty: el;
                              colliderEndEvent: hitEnd;
                              colliderEndEventProperty: el;
                              grabStartButtons: gripdown;
                              grabEndButtons: gripup;"
        ></a-mixin></a-assets>
	<a-entity>
	<a-camera>
    <!-- Or <a-entity cursor></a-entity> -->
  </a-camera>
	 <a-entity id="rhand" mixin="physics-hands"
                  hand-controls="hand: right; handModelStyle: lowPoly; color: #ffcccc">
        </a-entity>
        <a-entity id="lhand" mixin="physics-hands"
                  hand-controls="hand: left; handModelStyle: lowPoly; color: #ffcccc">
        </a-entity>
	</a-entity>
      <a-box static-body position="-3 0.5 -3" scale="0.1 25 75" color="#4CC3D9"></a-box>
      <a-box static-body position="3 0.5 -3" scale="0.1 25 75" color="#4CC3D9"></a-box>
	  

	  <a-box
    id="endTrigger"
    position="0 1 -5"
    scale="3 2 0.2"
    visible="false">
</a-box>
      <a-sphere id="ball"
          mixin="grab-move"
          dynamic-body="mass:5"
          position="0 1.2 -0.5"
          radius="0.15"
          color="#EF2D5E">
</a-sphere>
<a-text
    id="scoreboard"
    value="Score: 0"
    position="-2 2 -2"
    color="black"
    width="8">
</a-text>
	  <a-plane static-body position="0 0 -2" rotation="-90 0 0" width="40" height="160" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    
    <script>
AFRAME.registerComponent("pin-manager", {

  tick: function() {

    const rotation = this.el.object3D.rotation;

    const tiltX = Math.abs(THREE.MathUtils.radToDeg(rotation.x));
    const tiltZ = Math.abs(THREE.MathUtils.radToDeg(rotation.z));

    if (!this.el.dataset.counted &&
        this.el.object3D.position.y < 0.3) {

      this.el.dataset.counted = "true";

      BowlingGame.knockedDown++;
      console.log("Pin down");
    }
  }
});
</script>
  </body>
</html>
